<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages | Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-slate-900 flex min-h-screen">

<!-- Sidebar -->
<aside class="w-72 bg-slate-900 text-white flex flex-col fixed h-full z-50">
    <div class="p-8 border-b border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-bold text-xl">✚</div>
        <div>
            <h1 class="font-bold text-lg tracking-tight">MediLux</h1>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Admin Portal</p>
        </div>
    </div>
    
    <nav class="flex-1 p-6 space-y-2">
        <a href="dashboard.html" class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition">
            <span>📊</span> Dashboard
        </a>
        <a href="products.html" class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition">
            <span>💊</span> Products
        </a>
        <a href="orders.html" class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition">
            <span>📦</span> Orders
        </a>
        <a href="customers.html" class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition">
            <span>👤</span> Customers
        </a>
        <a href="messages.html" class="flex items-center gap-4 px-4 py-3 bg-emerald-500/10 text-emerald-400 rounded-xl font-semibold transition border border-emerald-500/20">
            <span>✉️</span> Messages
        </a>
    </nav>
</aside>

<main class="flex-1 ml-72 p-10">
    
    <header class="flex justify-between items-center mb-10">
        <div>
            <h2 class="text-3xl font-extrabold">Messages</h2>
            <p class="text-slate-500 mt-1">View and manage messages sent from the contact form.</p>
        </div>
    </header>

    <div class="bg-gray-50 rounded-[2.5rem] overflow-hidden shadow-sm border border-slate-100">
        <table class="w-full text-left">
            <thead>
                <tr class="bg-gray-100/50 text-slate-400 text-xs uppercase tracking-widest font-bold">
                    <th class="py-6 px-8">Sender Details</th>
                    <th class="py-6 px-8">Message</th>
                    <th class="py-6 px-8">Date</th>
                    <th class="py-6 px-8">Status</th>
                </tr>
            </thead>
            <tbody id="messagesBody" class="divide-y divide-slate-50">
                <!-- Loaded from DB -->
            </tbody>
        </table>

        <div id="noMessages" class="hidden text-center py-16">
            <p class="text-slate-400 font-bold">No messages found.</p>
        </div>
    </div>

</main>

<script>
    async function loadMessages() {
        try {
            const res = await fetch('/api/contact');
            if(!res.ok) throw new Error('Failed to load');
            const messages = await res.json();
            const tbody = document.getElementById('messagesBody');

            if(messages.length === 0) {
                document.getElementById('noMessages').classList.remove('hidden');
                return;
            }

            tbody.innerHTML = messages.map(m => {
                let dateStr = m.createdAt ? m.createdAt.substring(0, 16) : '';

                const statusColors = {
                    unread: 'bg-rose-50 text-rose-600',
                    read: 'bg-blue-50 text-blue-600',
                    replied: 'bg-emerald-50 text-emerald-600'
                };
                const currentColor = statusColors[m.status] || statusColors.unread;

                return `
                <tr class="hover:bg-gray-100/50 transition duration-300">
                    <td class="py-6 px-8">
                        <p class="font-bold text-slate-900">${m.name}</p>
                        <p class="text-sm text-slate-500 mt-1"><a href="mailto:${m.email}" class="text-emerald-600 hover:underline">${m.email}</a></p>
                    </td>
                    <td class="py-6 px-8">
                        <p class="text-sm text-slate-700 max-w-md">${m.message}</p>
                    </td>
                    <td class="py-6 px-8 text-sm text-slate-500 font-medium">${dateStr}</td>
                    <td class="py-6 px-8">
                        <select onchange="updateStatus(${m.id}, this.value)" class="${currentColor} px-4 py-2.5 rounded-2xl text-xs font-bold border-none ring-0 appearance-none cursor-pointer hover:opacity-80 transition">
                            <option value="unread" ${m.status === 'unread' ? 'selected' : ''}>UNREAD</option>
                            <option value="read" ${m.status === 'read' ? 'selected' : ''}>READ</option>
                            <option value="replied" ${m.status === 'replied' ? 'selected' : ''}>REPLIED</option>
                        </select>
                        <button onclick="deleteMessage(${m.id})" class="ml-2 px-3 py-2 bg-slate-100 text-rose-500 hover:bg-rose-100 rounded-xl text-xs font-bold transition">Delete</button>
                    </td>
                </tr>`;
            }).join('');

        } catch(e) {
            console.error(e);
            document.getElementById('noMessages').classList.remove('hidden');
            document.getElementById('noMessages').innerHTML = '<p class="text-rose-500 font-bold py-16">Failed to load messages from server.</p>';
        }
    }

    async function updateStatus(id, status) {
        try {
            const res = await fetch('/api/contact/' + id + '/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            });

            if(res.ok) {
                loadMessages();
                showToast('Message status updated!');
            } else {
                showToast('Failed to update status', false);
            }
        } catch(e) {
            showToast('Error: ' + e.message, false);
        }
    }

    async function deleteMessage(id) {
        if(!confirm('Are you sure you want to delete this message?')) return;
        try {
            const res = await fetch('/api/contact/' + id, { method: 'DELETE' });
            if(res.ok) {
                loadMessages();
                showToast('Message deleted successfully!');
            } else {
                showToast('Failed to delete message', false);
            }
        } catch(e) {
            showToast('Error: ' + e.message, false);
        }
    }

    function showToast(message, isSuccess=true) {
        const existing = document.getElementById('medilux-toast');
        if(existing) existing.remove();
        const toast = document.createElement('div');
        toast.id = 'medilux-toast';
        toast.className = `fixed top-10 left-1/2 -translate-x-1/2 z-[100] px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-white font-bold transition-all duration-500 transform translate-y-[-100%] opacity-0 ${isSuccess ? 'bg-slate-900' : 'bg-rose-500'}`;
        toast.innerHTML = `<span>${isSuccess ? '✅' : '❌'}</span><span>${message}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => { toast.classList.remove('translate-y-[-100%]', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); }, 10);
        setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-[-100%]', 'opacity-0'); setTimeout(() => toast.remove(), 500); }, 3000);
    }

    window.onload = loadMessages;
</script>

</body>
</html>
