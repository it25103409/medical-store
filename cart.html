<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | MediLux Pharmacy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter','sans-serif'] },
      animation: {
        'fade-up': 'fadeUp 0.8s ease forwards',
        'slide-in': 'slideIn 0.3s ease forwards'
      },
      keyframes: {
        fadeUp: {
          '0%': {opacity:'0', transform:'translateY(20px)'},
          '100%': {opacity:'1', transform:'translateY(0px)'}
        },
        slideIn: {
          '0%': {opacity:'0', transform:'translateX(20px)'},
          '100%': {opacity:'1', transform:'translateX(0px)'}
        }
      }
    }
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-slate-900">

<!-- Navbar -->
<header class="fixed top-0 left-0 w-full z-50 bg-gray-50/80 backdrop-blur-xl border-b border-slate-200">
<div class="max-w-7xl mx-auto px-6 lg:px-10">
<div class="h-20 flex items-center justify-between">
  <a href="index.html" class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-2xl bg-emerald-500 text-white flex items-center justify-center font-bold text-xl">✚</div>
    <div><h1 class="font-extrabold text-xl">MediLux</h1></div>
  </a>
  <nav class="hidden lg:flex gap-10 text-sm font-medium text-slate-600">
    <a href="index.html" class="hover:text-emerald-600">Home</a>
    <a href="products.html" class="hover:text-emerald-600">Products</a>
    <a href="track-order.html" class="hover:text-emerald-600 transition">Track Order</a>
    <a href="about.html" class="hover:text-emerald-600">About</a>
    <a href="contact.html" class="hover:text-emerald-600">Contact</a>
  </nav>
  <div class="flex items-center gap-5">
    <a href="cart.html" class="relative hover:scale-110 transition">
      <span class="text-2xl">🛒</span>
      <span id="cartBadge" class="hidden absolute -top-2 -right-2 w-5 h-5 bg-emerald-500 text-white text-[10px] flex items-center justify-center rounded-full font-bold">0</span>
    </a>
    <a id="authBtn" href="login.html" class="hidden md:block px-5 py-2.5 rounded-full border border-slate-300 hover:bg-slate-100 transition text-sm font-semibold">
      Login
    </a>
  </div>
</div>
</div>
</header>

<!-- Hero Banner -->
<section class="pt-20 pb-0 bg-gray-50 relative">
  <div class="w-full h-[260px] relative overflow-hidden">
    <img src="images/products_banner.png" class="absolute inset-0 w-full h-full object-cover scale-105 opacity-80" alt="Pharmacy Cart">
    <div class="absolute inset-0 bg-gradient-to-r from-emerald-900/90 via-emerald-900/50 to-transparent"></div>
    <div class="absolute inset-0 flex items-center">
      <div class="max-w-7xl mx-auto px-6 lg:px-10 w-full">
        <div class="animate-fade-up max-w-xl">
          <span class="inline-flex px-3 py-1 rounded-full bg-gray-50/20 text-white text-xs font-bold uppercase tracking-widest mb-4 border border-white/30">Secure Checkout</span>
          <h2 class="text-4xl lg:text-5xl font-black text-white tracking-tight leading-tight">Your <br><span class="text-emerald-300">Cart</span></h2>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="pt-16 pb-24 bg-gray-100">
<div class="max-w-5xl mx-auto px-6">
  <div class="animate-fade-up grid lg:grid-cols-3 gap-8">

    <!-- ======================== -->
    <!-- Cart Items (Left 2 cols) -->
    <!-- ======================== -->
    <div class="lg:col-span-2">
      <div class="bg-gray-50 rounded-[2.5rem] p-8 shadow-xl border border-slate-100">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-extrabold text-slate-800">Cart Items</h2>
          <button onclick="clearCart()" id="clearBtn"
            class="hidden text-xs text-rose-500 font-semibold border border-rose-200 px-4 py-2 rounded-full hover:bg-rose-50 transition">
            🗑 Clear All
          </button>
        </div>

        <!-- Cart Items Container (READ) -->
        <div id="cartItems" class="space-y-5 min-h-[120px]">
          <!-- Generated by JS -->
        </div>
      </div>

      <a href="products.html" class="mt-6 inline-block text-slate-500 font-semibold hover:text-emerald-600 transition">
        ← Continue Shopping
      </a>
    </div>

    <!-- ======================== -->
    <!-- Order Summary (Right col)-->
    <!-- ======================== -->
    <div class="lg:col-span-1">
      <div class="bg-gray-50 rounded-[2.5rem] p-7 shadow-xl border border-slate-100 sticky top-28">
        <h2 class="text-xl font-extrabold text-slate-800 mb-6">Order Summary</h2>

        <div class="space-y-3 text-sm text-slate-600 mb-6">
          <div class="flex justify-between">
            <span>Subtotal (<span id="itemCount">0</span> items)</span>
            <span id="subTotal" class="font-semibold">Rs. 0</span>
          </div>
          <div class="flex justify-between">
            <span>Delivery</span>
            <span class="text-emerald-600 font-semibold">Free</span>
          </div>
          <div class="border-t border-slate-200 pt-3 flex justify-between text-slate-900 font-extrabold text-lg">
            <span>Grand Total</span>
            <span id="grandTotal" class="text-emerald-600">Rs. 0</span>
          </div>
        </div>

        <!-- Delivery Address -->
        <div class="mb-5">
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            Delivery Address <span class="text-rose-500">*</span>
          </label>
          <textarea id="deliveryAddress" rows="3"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition resize-none text-sm"
            placeholder="Enter your full delivery address..."></textarea>
        </div>

        <!-- Checkout Button (CREATE Order) -->
        <button id="checkoutBtn" onclick="checkout()"
          class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-base hover:scale-[1.02] transition shadow-2xl shadow-slate-900/20 disabled:opacity-40 disabled:cursor-not-allowed">
          🛒 Proceed to Checkout
        </button>

        <!-- My Orders Link -->
        <button onclick="viewMyOrders()"
          class="w-full mt-3 py-3 border border-slate-200 text-slate-600 rounded-2xl font-semibold text-sm hover:bg-slate-100 transition">
          📦 View My Orders
        </button>
      </div>
    </div>

  </div>
</div>
</section>

<!-- ======================== -->
<!-- My Orders Modal (READ)   -->
<!-- ======================== -->
<div id="ordersModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[80vh] overflow-hidden flex flex-col">
    <div class="flex items-center justify-between px-8 py-5 border-b border-slate-100">
      <h3 class="text-xl font-extrabold">📦 My Orders</h3>
      <button onclick="closeOrdersModal()" class="text-slate-400 hover:text-rose-500 text-2xl font-bold transition">×</button>
    </div>
    <div id="ordersModalBody" class="overflow-y-auto p-8 space-y-4 flex-1">
      <p class="text-center text-slate-400">Loading...</p>
    </div>
  </div>
</div>

<!-- ======================== -->
<!-- Update Address Modal (UPDATE) -->
<!-- ======================== -->
<div id="updateAddressModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
    <h3 class="text-xl font-extrabold mb-1">✏️ Update Delivery Address</h3>
    <p class="text-sm text-slate-500 mb-5">Only pending orders can be updated.</p>
    <input type="hidden" id="updateOrderId">
    <textarea id="newAddress" rows="4"
      class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition resize-none text-sm mb-4"
      placeholder="Enter new delivery address..."></textarea>
    <div class="flex gap-3">
      <button onclick="submitAddressUpdate()"
        class="flex-1 py-3 bg-emerald-500 text-white rounded-xl font-bold hover:bg-emerald-600 transition">
        Save Changes
      </button>
      <button onclick="document.getElementById('updateAddressModal').classList.add('hidden')"
        class="flex-1 py-3 border border-slate-200 text-slate-600 rounded-xl font-semibold hover:bg-slate-50 transition">
        Cancel
      </button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CART CRUD — Frontend (localStorage based cart management)
// ============================================================

// READ - Cart load කිරීම
function loadCart() {
    let cart = JSON.parse(localStorage.getItem('medilux_cart')) || [];
    const container = document.getElementById('cartItems');
    const clearBtn = document.getElementById('clearBtn');
    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="text-center py-14">
                <div class="text-6xl mb-4">🛒</div>
                <p class="text-slate-500 font-medium text-lg">Your cart is empty</p>
                <a href="products.html" class="mt-4 inline-block text-emerald-600 font-semibold hover:underline">Browse Products →</a>
            </div>`;
        document.getElementById('subTotal').innerText = 'Rs. 0';
        document.getElementById('grandTotal').innerText = 'Rs. 0';
        document.getElementById('itemCount').innerText = '0';
        document.getElementById('checkoutBtn').disabled = true;
        if (clearBtn) clearBtn.classList.add('hidden');
        updateBadge();
        return;
    }

    document.getElementById('checkoutBtn').disabled = false;
    if (clearBtn) clearBtn.classList.remove('hidden');

    container.innerHTML = cart.map((p, index) => {
        const qty = p.quantity || 1;
        const itemTotal = parseFloat(p.price) * qty;
        total += itemTotal;
        let displayIcon = (p.icon && (p.icon.startsWith('http') || p.icon.startsWith('data:image')))
            ? `<img src="${p.icon}" class="w-full h-full object-cover rounded-xl">`
            : `<span class="text-3xl">${p.icon || '📦'}</span>`;
        return `
        <div class="flex items-center justify-between pb-5 border-b border-slate-100 animate-slide-in" id="cartItem-${index}">
            <div class="flex items-center gap-4">
                <div class="w-18 h-18 min-w-[72px] min-h-[72px] bg-gray-100 rounded-2xl flex items-center justify-center overflow-hidden">
                    ${displayIcon}
                </div>
                <div>
                    <h3 class="font-bold text-base text-slate-800">${p.name}</h3>
                    <p class="text-sm text-slate-500 mt-0.5">Rs. ${parseFloat(p.price).toLocaleString()} each</p>
                    <!-- UPDATE - Quantity Change -->
                    <div class="flex items-center gap-2 mt-2">
                        <button onclick="changeQty(${index}, -1)" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm flex items-center justify-center transition">−</button>
                        <span class="font-semibold text-sm w-6 text-center" id="qty-${index}">${qty}</span>
                        <button onclick="changeQty(${index}, 1)" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm flex items-center justify-center transition">+</button>
                    </div>
                </div>
            </div>
            <div class="text-right ml-4">
                <p class="font-extrabold text-base text-slate-800" id="itemTotal-${index}">Rs. ${itemTotal.toLocaleString()}</p>
                <!-- DELETE - Remove Item -->
                <button onclick="removeFromCart(${index})" class="text-xs text-rose-500 font-semibold hover:underline mt-1 block">Remove</button>
            </div>
        </div>`;
    }).join('');

    document.getElementById('subTotal').innerText = 'Rs. ' + total.toLocaleString();
    document.getElementById('grandTotal').innerText = 'Rs. ' + total.toLocaleString();
    document.getElementById('itemCount').innerText = cart.reduce((s, p) => s + (p.quantity || 1), 0);
    updateBadge();
}

// UPDATE - Quantity change කිරීම
function changeQty(index, delta) {
    let cart = JSON.parse(localStorage.getItem('medilux_cart')) || [];
    if (!cart[index]) return;
    cart[index].quantity = (cart[index].quantity || 1) + delta;
    if (cart[index].quantity < 1) cart[index].quantity = 1;
    localStorage.setItem('medilux_cart', JSON.stringify(cart));
    loadCart();
}

// DELETE - Cart item remove කිරීම
function removeFromCart(index) {
    let cart = JSON.parse(localStorage.getItem('medilux_cart')) || [];
    const name = cart[index]?.name || 'Item';
    cart.splice(index, 1);
    localStorage.setItem('medilux_cart', JSON.stringify(cart));
    showToast(`"${name}" removed from cart`, false);
    loadCart();
}

// DELETE - Cart clear කිරීම (සියල්ල delete)
function clearCart() {
    if (!confirm('Are you sure you want to clear the entire cart?')) return;
    localStorage.removeItem('medilux_cart');
    loadCart();
    showToast('Cart cleared', false);
}

// UPDATE Badge count
function updateBadge() {
    let cart = JSON.parse(localStorage.getItem('medilux_cart')) || [];
    const badge = document.getElementById('cartBadge');
    const total = cart.reduce((s, p) => s + (p.quantity || 1), 0);
    if (badge) {
        badge.innerText = total;
        if (total > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');
    }
}

// ============================================================
// CREATE - Checkout → Order Place කිරීම (API call)
// ============================================================
async function checkout() {
    let user = JSON.parse(localStorage.getItem('medilux_user'));
    if (!user) {
        showToast('Please login first to place an order!', false);
        setTimeout(() => window.location.href = 'login.html', 1500);
        return;
    }
    let cart = JSON.parse(localStorage.getItem('medilux_cart')) || [];
    if (cart.length === 0) return showToast('Your cart is empty', false);

    let address = document.getElementById('deliveryAddress').value.trim();
    if (!address) {
        showToast('Please enter your delivery address!', false);
        document.getElementById('deliveryAddress').focus();
        return;
    }

    let total = cart.reduce((sum, p) => sum + (parseFloat(p.price) * (p.quantity || 1)), 0);
    const btn = document.getElementById('checkoutBtn');
    btn.disabled = true;
    btn.innerText = '⏳ Placing Order...';

    try {
        const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: user.id,
                items: JSON.stringify(cart),
                address: address,
                total: total
            })
        });

        if (res.ok) {
            const data = await res.json();
            localStorage.removeItem('medilux_cart');
            showToast('Order Placed Successfully! 🎉');
            setTimeout(() => {
                window.location.href = 'track-order.html?id=' + encodeURIComponent(data.orderId);
            }, 2000);
        } else {
            const errText = await res.text();
            showToast('Failed to place order: ' + errText, false);
            btn.disabled = false;
            btn.innerText = '🛒 Proceed to Checkout';
        }
    } catch (e) {
        showToast('Connection Error: ' + e.message, false);
        btn.disabled = false;
        btn.innerText = '🛒 Proceed to Checkout';
    }
}

// ============================================================
// READ - My Orders බලා ගැනීම (Modal)
// ============================================================
async function viewMyOrders() {
    let user = JSON.parse(localStorage.getItem('medilux_user'));
    if (!user) {
        showToast('Please login first!', false);
        setTimeout(() => window.location.href = 'login.html', 1500);
        return;
    }

    document.getElementById('ordersModal').classList.remove('hidden');
    document.getElementById('ordersModalBody').innerHTML = '<p class="text-center text-slate-400 py-8">Loading your orders...</p>';

    try {
        const res = await fetch(`/api/orders/user/${user.id}`);
        const orders = await res.json();

        if (!orders || orders.length === 0) {
            document.getElementById('ordersModalBody').innerHTML =
                '<div class="text-center py-12"><div class="text-5xl mb-3">📦</div><p class="text-slate-500">No orders yet</p></div>';
            return;
        }

        const statusColors = {
            pending:    'bg-amber-100 text-amber-700',
            processing: 'bg-blue-100 text-blue-700',
            shipped:    'bg-purple-100 text-purple-700',
            delivered:  'bg-emerald-100 text-emerald-700',
            cancelled:  'bg-rose-100 text-rose-700'
        };

        document.getElementById('ordersModalBody').innerHTML = orders.map(o => `
            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="font-extrabold text-slate-800">${o.orderId}</p>
                        <p class="text-xs text-slate-400 mt-0.5">${o.orderDate || ''}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${statusColors[o.status] || 'bg-slate-100 text-slate-600'}">
                        ${o.status?.toUpperCase() || 'UNKNOWN'}
                    </span>
                </div>
                <div class="flex items-center justify-between text-sm">
                    <span class="text-slate-500 truncate max-w-[60%]">📍 ${o.address}</span>
                    <span class="font-bold text-slate-800">Rs. ${parseFloat(o.total).toLocaleString()}</span>
                </div>
                <div class="flex gap-2 mt-4">
                    <!-- UPDATE Address -->
                    ${o.status === 'pending' ? `
                    <button onclick="openUpdateAddress('${o.orderId}', \`${o.address.replace(/`/g, '\\`')}\`)"
                        class="flex-1 py-2 text-xs font-bold border border-slate-200 rounded-xl hover:bg-slate-100 transition">
                        ✏️ Update Address
                    </button>` : ''}
                    <!-- DELETE / Cancel -->
                    ${o.status === 'pending' ? `
                    <button onclick="cancelOrder('${o.orderId}')"
                        class="flex-1 py-2 text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200 rounded-xl hover:bg-rose-100 transition">
                        ✕ Cancel Order
                    </button>` : ''}
                    <!-- Track -->
                    <a href="track-order.html?id=${encodeURIComponent(o.orderId)}"
                        class="flex-1 py-2 text-xs font-bold bg-slate-900 text-white rounded-xl hover:bg-slate-700 transition text-center">
                        📦 Track
                    </a>
                </div>
            </div>`).join('');

    } catch (e) {
        document.getElementById('ordersModalBody').innerHTML = `<p class="text-center text-rose-500">Error: ${e.message}</p>`;
    }
}

function closeOrdersModal() {
    document.getElementById('ordersModal').classList.add('hidden');
}

// ============================================================
// UPDATE - Delivery Address Update කිරීම
// ============================================================
function openUpdateAddress(orderId, currentAddress) {
    document.getElementById('updateOrderId').value = orderId;
    document.getElementById('newAddress').value = currentAddress;
    document.getElementById('updateAddressModal').classList.remove('hidden');
}

async function submitAddressUpdate() {
    let user = JSON.parse(localStorage.getItem('medilux_user'));
    const orderId = document.getElementById('updateOrderId').value;
    const newAddress = document.getElementById('newAddress').value.trim();

    if (!newAddress) return showToast('Please enter an address', false);

    try {
        const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/address`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.id, address: newAddress })
        });

        if (res.ok) {
            document.getElementById('updateAddressModal').classList.add('hidden');
            showToast('Address updated successfully ✅');
            viewMyOrders(); // Refresh list
        } else {
            const msg = await res.text();
            showToast(msg, false);
        }
    } catch (e) {
        showToast('Error: ' + e.message, false);
    }
}

// ============================================================
// DELETE - Order Cancel කිරීම (User side)
// ============================================================
async function cancelOrder(orderId) {
    let user = JSON.parse(localStorage.getItem('medilux_user'));
    if (!confirm(`Cancel order ${orderId}? This cannot be undone.`)) return;

    try {
        const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/cancel`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.id })
        });

        if (res.ok) {
            showToast('Order cancelled successfully');
            viewMyOrders(); // Refresh list
        } else {
            const msg = await res.text();
            showToast(msg, false);
        }
    } catch (e) {
        showToast('Error: ' + e.message, false);
    }
}

// ============================================================
// Auth Setup
// ============================================================
function setupAuth() {
    let user = JSON.parse(localStorage.getItem('medilux_user'));
    const btn = document.getElementById('authBtn');
    if (user && btn) {
        btn.innerText = user.name;
        btn.href = '#';
        btn.onclick = function(e) {
            e.preventDefault();
            if (confirm('Do you want to logout?')) {
                localStorage.removeItem('medilux_user');
                window.location.reload();
            }
        };
        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
    }
}

// ============================================================
// Toast Notification
// ============================================================
function showToast(message, isSuccess = true) {
    const existing = document.getElementById('medilux-toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.id = 'medilux-toast';
    toast.className = `fixed top-10 left-1/2 -translate-x-1/2 z-[100] px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-white font-bold transition-all duration-500 transform translate-y-[-100%] opacity-0 ${isSuccess ? 'bg-slate-900' : 'bg-rose-500'}`;
    toast.innerHTML = `<span>${isSuccess ? '✅' : '❌'}</span><span>${message}</span>`;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.classList.remove('translate-y-[-100%]', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
    }, 10);

    setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-100%]', 'opacity-0');
        setTimeout(() => toast.remove(), 500);
    }, 3000);
}

// Init
window.onload = () => {
    loadCart();
    setupAuth();
};
</script>

</body>
</html>
